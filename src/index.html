<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Racer Lab</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
  </head>
  <body>
    <app-root>
      <main
        aria-busy="true"
        aria-live="polite"
        style="
          display: grid;
          min-height: 100dvh;
          place-items: center;
          background: #f8fafc;
          color: #0f172a;
          font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        "
      >
        <div style="text-align: center">
          <div
            aria-hidden="true"
            style="
              width: 2.75rem;
              height: 2.75rem;
              margin: 0 auto 1.25rem;
              border: 4px solid #dbeafe;
              border-top-color: #004ac6;
              border-radius: 9999px;
              animation: racerlab-spin 0.8s linear infinite;
            "
          ></div>
          <strong style="font-size: 1.25rem">Racer Lab</strong>
          <p style="margin: 0.5rem 0 0; color: #64748b; font-size: 0.875rem">
            Preparando la aplicación…
          </p>
        </div>
      </main>
    </app-root>
    <style>
      @keyframes racerlab-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </body>
</html>
