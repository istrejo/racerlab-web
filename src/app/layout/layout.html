<app-icon-sprite />
<app-application-navigation
  [mobileNavigationOpen]="mobileNavigationOpen()"
  (mobileNavigationDismissed)="closeMobileNavigation()"
/>

<div class="min-h-dvh bg-slate-50 text-slate-950 lg:ml-64">
  <header
    class="sticky top-0 z-10 border-b border-slate-200 bg-white/95 px-4 py-3 backdrop-blur sm:px-6 lg:px-8"
  >
    <div class="mx-auto flex max-w-[1440px] items-center justify-between gap-4">
      <div class="flex min-w-0 items-center gap-2 lg:hidden">
        <button
          aria-controls="application-navigation"
          aria-label="Toggle navigation"
          [attr.aria-expanded]="mobileNavigationOpen()"
          class="flex size-9 shrink-0 flex-col items-center justify-center gap-1 rounded-md border border-slate-200 bg-white text-slate-700 hover:bg-slate-100 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[#004AC6] focus-visible:ring-offset-2"
          (click)="toggleMobileNavigation()"
          type="button"
        >
          <span aria-hidden="true" class="h-0.5 w-4 bg-current"></span>
          <span aria-hidden="true" class="h-0.5 w-4 bg-current"></span>
          <span aria-hidden="true" class="h-0.5 w-4 bg-current"></span>
        </button>
        <p class="truncate font-[Manrope,ui-sans-serif] text-lg font-bold">Racer Lab</p>
      </div>
      <div class="hidden max-w-md flex-1 lg:block">
        <label class="sr-only" for="application-search">Search workspace</label
        ><input
          class="h-9 w-full rounded-md border border-slate-200 bg-slate-50 px-3 text-sm placeholder:text-slate-400 disabled:cursor-not-allowed"
          disabled
          id="application-search"
          placeholder="Search workspace..."
          type="search"
        />
      </div>
      <div class="ml-auto flex items-center gap-2 sm:gap-3">
        @if (permissions.canWriteOrders()) {
          <a
            class="hidden h-9 items-center rounded-md bg-[#004AC6] px-3 text-sm font-semibold text-white shadow-sm sm:flex"
            [routerLink]="'/service-orders/new'"
          >
            New order
          </a>
        }
        <div class="hidden text-right sm:block">
          <p class="text-sm font-semibold">{{ workshopName() }}</p>
          <p class="text-xs font-medium text-slate-500">{{ workshopRole() }}</p>
        </div>
        <div class="relative" data-user-menu>
          <button
            #userMenuTrigger
            aria-controls="user-menu"
            aria-haspopup="true"
            aria-label="Abrir menú de usuario"
            [attr.aria-expanded]="userMenuOpen()"
            class="flex size-9 items-center justify-center rounded-full border border-slate-200 bg-slate-100 text-sm font-bold text-slate-700 hover:bg-slate-200 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[#004AC6] focus-visible:ring-offset-2 disabled:cursor-wait disabled:opacity-60"
            [disabled]="logoutPending() || profileLoading()"
            (click)="toggleUserMenu()"
            type="button"
          >
            @if (profileLoading()) {
              <span
                aria-hidden="true"
                class="size-4 animate-pulse rounded-full bg-slate-300"
              ></span>
            } @else {
              {{ userInitial() }}
            }
          </button>

          @if (userMenuOpen()) {
            <div
              aria-labelledby="user-menu-name"
              class="absolute right-0 top-12 z-20 w-64 overflow-hidden rounded-xl border border-slate-200 bg-white shadow-lg"
              id="user-menu"
            >
              <div class="border-b border-slate-200 px-4 py-3">
                @if (profileLoading()) {
                  <div aria-label="Cargando perfil" class="space-y-2">
                    <span class="block h-4 w-28 animate-pulse rounded bg-slate-200"></span>
                    <span class="block h-3 w-40 animate-pulse rounded bg-slate-100"></span>
                  </div>
                } @else {
                  <p class="truncate text-sm font-semibold text-slate-950" id="user-menu-name">
                    {{ userName() }}
                  </p>
                  @if (userEmail()) {
                    <p class="mt-0.5 truncate text-xs text-slate-500">{{ userEmail() }}</p>
                  }
                }
              </div>
              <div class="p-2">
                <button
                  aria-live="polite"
                  [attr.aria-busy]="logoutPending()"
                  class="flex w-full items-center gap-2 rounded-lg px-3 py-2.5 text-left text-sm font-semibold text-red-700 hover:bg-red-50 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-red-600 disabled:cursor-wait disabled:text-red-400"
                  data-action="logout"
                  [disabled]="logoutPending()"
                  (click)="logout()"
                  type="button"
                >
                  @if (logoutPending()) {
                    <span
                      aria-hidden="true"
                      class="size-4 shrink-0 animate-spin rounded-full border-2 border-red-200 border-t-red-700"
                      data-loading="logout"
                    ></span>
                  }
                  <span>{{ logoutPending() ? 'Cerrando sesión…' : 'Cerrar sesión' }}</span>
                </button>
              </div>
            </div>
          }
        </div>
      </div>
    </div>
  </header>

  <main class="mx-auto max-w-[1440px] px-4 py-6 sm:px-6 lg:px-8 lg:py-8"><router-outlet /></main>
</div>
