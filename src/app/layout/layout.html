<app-icon-sprite />
<app-application-navigation [mobileNavigationOpen]="mobileNavigationOpen()" (mobileNavigationDismissed)="closeMobileNavigation()" />

<div class="min-h-dvh bg-slate-50 text-slate-950 lg:ml-64">
  <header class="sticky top-0 z-10 border-b border-slate-200 bg-white/95 px-4 py-3 backdrop-blur sm:px-6 lg:px-8">
    <div class="mx-auto flex max-w-[1440px] items-center justify-between gap-4">
      <div class="flex min-w-0 items-center gap-2 lg:hidden">
        <button aria-controls="application-navigation" aria-label="Toggle navigation" [attr.aria-expanded]="mobileNavigationOpen()" class="flex size-9 shrink-0 flex-col items-center justify-center gap-1 rounded-md border border-slate-200 bg-white text-slate-700 hover:bg-slate-100 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[#004AC6] focus-visible:ring-offset-2" (click)="toggleMobileNavigation()" type="button">
          <span aria-hidden="true" class="h-0.5 w-4 bg-current"></span>
          <span aria-hidden="true" class="h-0.5 w-4 bg-current"></span>
          <span aria-hidden="true" class="h-0.5 w-4 bg-current"></span>
        </button>
        <p class="truncate font-[Manrope,ui-sans-serif] text-lg font-bold">Racer Lab</p>
      </div>
      <div class="hidden max-w-md flex-1 lg:block"><label class="sr-only" for="application-search">Search workspace</label><input class="h-9 w-full rounded-md border border-slate-200 bg-slate-50 px-3 text-sm placeholder:text-slate-400 disabled:cursor-not-allowed" disabled id="application-search" placeholder="Search workspace..." type="search" /></div>
      <div class="ml-auto flex items-center gap-2 sm:gap-3">
        <button class="hidden h-9 rounded-md bg-[#004AC6] px-3 text-sm font-semibold text-white shadow-sm disabled:cursor-not-allowed disabled:bg-blue-900 sm:block" disabled title="Service orders are not available yet" type="button">New order</button>
        <div class="hidden text-right sm:block"><p class="text-sm font-semibold">{{ workshopName() }}</p><p class="text-xs font-medium text-slate-500">{{ workshopRole() }}</p></div>
        <button class="flex size-9 items-center justify-center rounded-full border border-slate-200 bg-slate-100 text-sm font-bold text-slate-700 hover:bg-slate-200 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[#004AC6] focus-visible:ring-offset-2" (click)="logout()" title="Sign out" type="button">{{ workshopInitial() }}</button>
      </div>
    </div>
  </header>

  <main class="mx-auto max-w-[1440px] px-4 py-6 sm:px-6 lg:px-8 lg:py-8"><router-outlet /></main>
</div>
