<main class="min-h-dvh bg-slate-50 p-6 text-slate-900 sm:p-10">
  <section
    class="mx-auto flex max-w-5xl items-start justify-between gap-6 rounded-2xl border border-slate-200 bg-white p-6 shadow-sm"
  >
    <div>
      <p class="text-sm font-semibold text-[#F97316]">Operación del taller</p>
      <h1 class="mt-2 font-[Manrope,ui-sans-serif] text-3xl font-bold">Panel principal</h1>
      <p class="mt-2 text-slate-600">
        {{ auth.activeWorkshop()?.name ?? 'Tu espacio de trabajo' }} está listo.
      </p>
    </div>
    <div class="flex flex-wrap justify-end gap-3">
      <a
        class="flex h-11 items-center rounded-lg border border-slate-300 px-4 text-sm font-semibold text-slate-700 hover:bg-slate-50 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[#004AC6] focus-visible:ring-offset-2"
        routerLink="workshops/new"
      >
        Crear taller
      </a>
      @if (auth.canManageUsers()) {
        <a
          class="flex h-11 items-center rounded-lg bg-[#004AC6] px-4 text-sm font-semibold text-white hover:bg-blue-700 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[#004AC6] focus-visible:ring-offset-2"
          routerLink="/settings/users"
        >
          Gestionar usuarios
        </a>
      }
      <button
        class="h-11 rounded-lg border border-slate-200 px-4 text-sm font-semibold text-slate-700 transition hover:bg-slate-50 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[#004AC6] focus-visible:ring-offset-2"
        (click)="logout()"
        type="button"
      >
        Cerrar sesión
      </button>
    </div>
  </section>
</main>
