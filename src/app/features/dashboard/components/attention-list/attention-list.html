<article class="rounded-xl border border-slate-200 bg-white shadow-sm">
  <header class="flex items-start justify-between gap-4 border-b border-slate-200 px-5 py-4">
    <div>
      <h2 class="font-[Manrope,ui-sans-serif] text-lg font-bold">{{ title() }}</h2>
      <p class="mt-1 text-sm text-slate-500">{{ description() }}</p>
    </div>
    <span
      class="rounded-full px-2.5 py-1 text-xs font-semibold"
      [class.bg-orange-50]="tone() === 'warning'"
      [class.text-[#C2410C]]="tone() === 'warning'"
      [class.bg-red-50]="tone() === 'danger'"
      [class.text-red-700]="tone() === 'danger'"
      >{{ badge() }}</span
    >
  </header>
  <ul class="divide-y divide-slate-100">
    @for (item of items(); track item.id) {
      <li class="flex items-center justify-between gap-4 px-5 py-4">
        <div>
          <p class="font-semibold">{{ item.primary }}</p>
          <p class="mt-1 text-sm text-slate-500">{{ item.secondary }}</p>
        </div>
        <div class="text-right">
          <p class="font-semibold" [class.text-red-700]="tone() === 'danger'">{{ item.value }}</p>
          <p
            class="mt-1 text-xs font-medium"
            [class.text-[#C2410C]]="tone() === 'warning'"
            [class.text-slate-500]="tone() === 'danger'"
          >
            {{ item.detail }}
          </p>
        </div>
      </li>
    }
  </ul>
</article>
