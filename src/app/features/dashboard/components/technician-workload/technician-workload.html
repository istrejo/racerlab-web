<article class="rounded-xl border border-slate-200 bg-white shadow-sm">
  <header class="border-b border-slate-200 px-5 py-4">
    <h2 class="font-[Manrope,ui-sans-serif] text-lg font-bold">Technician workload</h2>
    <p class="mt-1 text-sm text-slate-500">Active and pending repair work</p>
  </header>
  <div class="space-y-5 p-5">
    @for (technician of technicians(); track technician.id) {
      <div>
        <div class="flex items-center justify-between gap-3 text-sm">
          <p class="font-semibold">{{ technician.name }}</p>
          <p class="text-xs text-slate-500">
            {{ technician.active }} active / {{ technician.pending }} pending
          </p>
        </div>
        <div
          class="mt-2 flex h-2 overflow-hidden rounded-full bg-slate-100"
          [attr.aria-label]="technician.name + ' workload'"
          [attr.aria-valuenow]="technician.activePercent + technician.pendingPercent"
          aria-valuemax="100"
          aria-valuemin="0"
          role="progressbar"
        >
          <span
            [class.bg-[#004AC6]]="technician.tone === 'primary'"
            [class.bg-[#F97316]]="technician.tone === 'warning'"
            [class.bg-emerald-600]="technician.tone === 'success'"
            [style.width.%]="technician.activePercent"
          ></span
          ><span class="bg-slate-300" [style.width.%]="technician.pendingPercent"></span>
        </div>
        @if (technician.active === 0 && technician.pending === 0) {
          <p class="mt-2 text-xs font-medium text-emerald-700">Available</p>
        }
      </div>
    }
  </div>
</article>
