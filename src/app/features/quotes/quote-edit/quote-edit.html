<main class="min-h-dvh bg-slate-50 px-4 py-8 text-slate-900 sm:px-8">
  <section class="mx-auto max-w-3xl">
    <a
      class="text-sm font-semibold text-[#004AC6] hover:underline"
      [routerLink]="['/service-orders', orderId, 'quotes', quoteId]"
      >← Volver a la cotización</a
    >
    <div class="mt-5 rounded-2xl border border-slate-200 bg-white p-6 shadow-sm sm:p-8">
      <p class="text-sm font-semibold text-[#F97316]">Cotizaciones</p>
      <h1 class="mt-2 text-2xl font-bold">Editar borrador</h1>
      <div class="mt-6">
        <app-loading-skeleton
          label="Cargando la cotización…"
          name="quote-edit"
          variant="form"
          [loading]="loading()"
        >
          @if (initialValue(); as draft) {
            <app-quote-editor
              submitLabel="Guardar cambios"
              [error]="error()"
              [initialValue]="draft"
              [pending]="pending()"
              (cancelled)="cancel()"
              (submitted)="save($event)"
            />
          } @else if (error()) {
            <p
              class="rounded-lg border border-red-200 bg-red-50 p-3 text-sm text-red-800"
              role="alert"
            >
              {{ error() }}
            </p>
          }
        </app-loading-skeleton>
      </div>
    </div>
  </section>
</main>
