<main class="min-h-dvh bg-slate-50 px-4 py-8 text-slate-900 sm:px-8">
  <section class="mx-auto max-w-3xl">
    <a class="text-sm font-semibold text-[#004AC6]" [routerLink]="['/service-orders', orderId]">
      ← Volver a la orden
    </a>
    <h1 class="mt-3 text-2xl font-bold">Nueva cotización</h1>

    <div class="mt-6">
      <app-quote-editor
        submitLabel="Guardar borrador"
        [error]="error()"
        [pending]="pending()"
        (cancelled)="cancel()"
        (submitted)="save($event)"
      />
    </div>
  </section>
</main>
