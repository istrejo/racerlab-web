<app-modal
  description="Seleccioná el contexto de trabajo. Volverás al inicio del dashboard."
  title="Cambiar taller"
  [busy]="selectingId() !== null"
  [open]="true"
  (dismissed)="closed.emit()"
>
  @if (loading()) {
    <p class="py-8 text-center text-sm text-slate-500" role="status">Cargando tus talleres…</p>
  } @else if (error()) {
    <div class="rounded-lg border border-red-200 bg-red-50 p-4 text-red-800" role="alert">
      <p>{{ error() }}</p>
      <button class="mt-2 font-semibold underline" (click)="load()" type="button">
        Reintentar
      </button>
    </div>
  } @else {
    <ul class="space-y-2" role="list">
      @for (workshop of workshops(); track workshop.id) {
        <li>
          <button
            class="flex w-full items-center justify-between rounded-xl border border-slate-200 p-4 text-left hover:border-[#004AC6] disabled:bg-slate-50 disabled:opacity-70"
            [attr.aria-current]="workshop.id === auth.activeWorkshop()?.workshopId ? 'true' : null"
            [disabled]="selectingId() !== null || workshop.id === auth.activeWorkshop()?.workshopId"
            (click)="select(workshop)"
            type="button"
          >
            <span>
              <span class="block font-semibold">{{ workshop.name }}</span>
              <span class="block text-sm text-slate-500">{{ workshop.role }}</span>
            </span>
            @if (workshop.id === auth.activeWorkshop()?.workshopId) {
              <span class="text-xs font-semibold text-[#004AC6]">Actual</span>
            } @else if (selectingId() === workshop.id) {
              <span class="text-xs text-slate-500">Cambiando…</span>
            }
          </button>
        </li>
      }
    </ul>
  }
</app-modal>
