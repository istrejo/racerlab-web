<main class="min-h-dvh bg-slate-50 px-4 py-8 text-slate-900 sm:px-8">
  <section class="mx-auto max-w-2xl">
    <a
      class="text-sm font-semibold text-[#004AC6] hover:underline"
      [routerLink]="['/customers', customerId, 'vehicles']"
    >
      ← Volver a vehículos
    </a>
    <h1 class="mt-6 text-2xl font-bold">Nuevo vehículo</h1>

    @if (error()) {
      <div class="mt-4 rounded-lg border border-red-200 bg-red-50 p-4 text-red-800" role="alert">
        {{ error() }}
      </div>
    }

    <div class="mt-6 rounded-xl border border-slate-200 bg-white p-6 shadow-sm">
      <app-vehicle-form
        [pending]="pending()"
        [cancelHref]="'/customers/' + customerId + '/vehicles'"
        (submitted)="save($event)"
      />
    </div>
  </section>
</main>
