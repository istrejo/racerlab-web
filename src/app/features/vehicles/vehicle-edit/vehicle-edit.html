<main class="min-h-dvh bg-slate-50 px-4 py-8 text-slate-900 sm:px-8">
  <section class="mx-auto max-w-2xl">
    <a
      class="text-sm font-semibold text-[#004AC6] hover:underline"
      [routerLink]="['/customers', customerId, 'vehicles', vehicleId]"
    >
      ← Volver al vehículo
    </a>
    <h1 class="mt-6 text-2xl font-bold">Editar vehículo</h1>

    <div class="mt-6">
      <app-loading-skeleton
        label="Cargando vehículo…"
        name="vehicle-edit"
        variant="detail"
        [loading]="loading()"
      >
        @if (loadError()) {
          <div class="rounded-lg border border-red-200 bg-red-50 p-4 text-red-800" role="alert">
            {{ loadError() }}
          </div>
        } @else {
          @if (saveError()) {
            <div class="mb-4 rounded-lg border border-red-200 bg-red-50 p-4 text-red-800" role="alert">
              {{ saveError() }}
            </div>
          }
          <div class="rounded-xl border border-slate-200 bg-white p-6 shadow-sm">
            <app-vehicle-form
              [vehicle]="vehicle()"
              [pending]="pending()"
              [cancelHref]="'/customers/' + customerId + '/vehicles/' + vehicleId"
              (submitted)="save($event)"
            />
          </div>
        }
      </app-loading-skeleton>
    </div>
  </section>
</main>
